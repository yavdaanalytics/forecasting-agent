[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forecasting-agent"
version = "0.1.0"
description = "Demand forecasting agent with CV segmentation and multi-method testing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Amit Mohanty" }]
dependencies = [
  "numpy>=1.20.0",
  "pandas>=1.3.0",
  "pydantic>=2.0.0",
  "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1.0"]
ets = ["statsmodels>=0.14.0"]
gcp = [
  "google-cloud-bigquery>=3.0.0",
  "google-cloud-storage>=2.0.0",
]
agent = ["langgraph>=0.1.0"]
reporting = ["jinja2>=3.0.0"]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
]

[project.scripts]
forecasting-agent = "forecasting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "prophet: tests that require prophet",
  "integration: slower pipeline tests",
]

[tool.black]
line-length = 100
target-version = ["py311"]
