name: Org-Wide CI/CD - Python

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Universal security checks
  security:
    uses: ./.github/workflows/universal-security.yml
    secrets: inherit

  # Python CI - for Python/Jupyter repositories
  python-ci:
    uses: ./.github/workflows/python-ci.yml
    with:
      python-version: '3.11'
    secrets: inherit
