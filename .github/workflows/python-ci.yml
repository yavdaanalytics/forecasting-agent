name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: string
      test-command:
        description: 'Command to run tests (e.g., pytest, python -m pytest)'
        required: false
        default: 'pytest'
        type: string
      lint-command:
        description: 'Command to run linting (e.g., ruff check, pylint)'
        required: false
        default: 'ruff check .'
        type: string
      format-command:
        description: 'Command to check formatting (e.g., black --check)'
        required: false
        default: 'black --check .'
        type: string

jobs:
  python-ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt found"
          pip install pytest ruff black bandit safety

      - name: Run linting
        run: ${{ inputs.lint-command }}
        continue-on-error: true

      - name: Check formatting
        run: ${{ inputs.format-command }}
        continue-on-error: true

      - name: Run tests
        run: ${{ inputs.test-command }}
        continue-on-error: false

      - name: Security check - Bandit (SAST)
        run: bandit -r . -f json -o bandit-report.json 2>/dev/null || true
        continue-on-error: true

      - name: Security check - Safety (Dependencies)
        run: safety check --json 2>/dev/null || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()
